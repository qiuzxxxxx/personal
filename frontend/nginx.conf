# Nginx configuration for the zixxx workbench.
#
# It serves the built frontend, terminates TLS and proxies the API, the SSE
# stream and the WebSocket to the backend.

upstream zixxx_backend {
    server web:8000;
    keepalive 16;
}

# The transfer station accepts anonymous uploads; the body limit is generous
# but the application enforces its own per-file and per-address budgets.
client_max_body_size 512m;

server {
    listen 80;
    server_name _;

    # ACME challenges are served over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/workbench/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Large uploads are streamed to a temporary file on disk.
    client_body_temp_path /var/cache/nginx/client_temp;
    client_max_body_size 512m;
    client_body_buffer_size 256k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        # The Vite build writes its hashed bundles here.
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        access_log off;
    }

    location /static/ {
        # Django's collectstatic output, shared with the web container.
        alias /usr/share/nginx/html/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        # The backend streams private files with an authorisation check, so
        # the media directory is never exposed directly.
        return 404;
    }

    location /api/ {
        proxy_pass http://zixxx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming answers must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://zixxx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
